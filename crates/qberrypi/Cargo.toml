[package]
name = "qberrypi"
description = "PID 1 for the qberrypi operating system"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
hickory-proto = "0.26"
httparse = "1"
libc = "0.2.191"
log = "0.4.35"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
qb-dns = { version = "0.1.0", path = "../qb-dns" }
qb-panel = { version = "0.1.0", path = "../qb-panel" }
qb-wpa2 = { version = "0.1.0", path = "../qb-wpa2" }
rustix = { version = "1.1.6", features = ["fs", "mount", "system", "time", "process", "event", "net", "rand", "mm", "thread"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-pki-types = { version = "1.15.1", features = ["std"] }
rustls-rustcrypto = "=0.1.0-pre.0"
rustls-webpki = { version = "0.103.16", default-features = false, features = ["alloc"] }
ruzstd = { version = "0.9", default-features = false, features = ["std"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
sha2 = { version = "0.11", default-features = false }
subtle = "2.6"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "net", "time", "sync", "io-util", "macros"] }
toml = { version = "1.2.1", default-features = false, features = ["parse", "serde", "std"] }
tz-rs = { version = "0.7", default-features = false, features = ["std"] }
webpki-roots = "1"
zeroize = "1.9.1"

[dev-dependencies]
aes-kw = { version = "0.3.1", features = ["zeroize"] }
hex-literal = "1.1.0"
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["test-util"] }
