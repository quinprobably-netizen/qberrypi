[package]
name = "qb-wpa2"
description = "WPA2-PSK supplicant for qberrypi: key derivation and the four-way and group-key handshakes as a pure state machine, no I/O"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
aes-kw = { version = "0.3.1", features = ["zeroize"] }
hmac = { version = "0.13.0", features = ["zeroize"] }
pbkdf2 = "0.13.0"
sha1 = { version = "0.11.0", features = ["zeroize"] }
subtle = "2.6.1"
zeroize = "1.9.1"

[dev-dependencies]
hex-literal = "1.1.0"
