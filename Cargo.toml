[workspace]
resolver = "3"
members = ["crates/qberrypi", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/quinprobably-netizen/qberrypi"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true

# `cargo xtask fetch` hashes about 40 MB on every run; unoptimised, that alone takes seconds.
[profile.dev.package.sha2]
opt-level = 3
