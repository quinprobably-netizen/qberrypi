[package]
name = "xtask"
description = "Development tasks for qberrypi: fetch, build, test in QEMU, deploy"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
ar = "0.9.0"
clap = { version = "4.6.7", features = ["derive"] }
fatfs = { version = "0.3.6", default-features = false, features = ["std", "alloc"] }
qberrypi = { version = "0.1.0", path = "../crates/qberrypi" }
sha2 = "0.11.1"
tar = "0.4.46"
tempfile = "3.27.0"
ureq = "3.5.1"
zstd = "0.14.3"
