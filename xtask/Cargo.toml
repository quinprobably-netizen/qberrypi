[package]
name = "xtask"
description = "Development tasks for qberrypi: fetch, build, test in QEMU, deploy"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
ar = "0.9.0"
clap = { version = "4.6.7", features = ["derive"] }
fatfs = { version = "0.3.6", default-features = false, features = ["std", "alloc"] }
hickory-proto = "0.26"
png = "0.18.1"
qb-dns = { version = "0.1.0", path = "../crates/qb-dns" }
qb-panel = { version = "0.1.0", path = "../crates/qb-panel" }
qb-wpa2 = { version = "0.1.0", path = "../crates/qb-wpa2" }
qberrypi = { version = "0.1.0", path = "../crates/qberrypi" }
rcgen = "0.14"
rustix = { version = "1.1.6", features = ["fs"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.46"
tempfile = "3.27.0"
time = "0.3.55"
ureq = "3.5.1"
zeroize = "1.9.1"
zstd = "0.14.3"

[dev-dependencies]
x509-parser = "0.18.1"
